openapi: 3.1.0
info:
  title: ALMAZEN SMS Gateway API
  version: 1.1.0
  description: >-
    ALMAZEN SMS API. Message submission is persisted transactionally with the
    outbox. The selected hosting uses MariaDB and Laravel Database Queue; Redis
    is not required. Each API key has a daily limit and a per-minute limit.
    A project daily ceiling is an extra guard. Effective daily remaining is the
    minimum of the key remainder and the project-ceiling remainder. Replaying
    the same Idempotency-Key does not consume quota. OTP is disabled until an
    administrator enables it for a project. OTP request and verify responses
    never contain the code. This API does not itself transmit SMS.
    `sent_to_network` is not proof of recipient delivery. Production requests
    must use HTTPS.
servers:
  - url: https://api.example.invalid/api/v1
    description: Placeholder only; no production host has been provisioned.
tags:
  - name: Auth
  - name: Projects
  - name: API keys
  - name: Devices
  - name: Messages
  - name: OTP
security: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Create a short-lived-by-policy operator bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, maxLength: 200 }
                device_name: { type: string, maxLength: 80 }
      responses:
        '201': { description: Token issued once; response has Cache-Control no-store. }
        '401': { description: Invalid credentials. }
        '403': { description: User disabled. }
        '429': { description: Login rate limit exceeded. }
  /auth/token:
    delete:
      tags: [Auth]
      summary: Revoke the current operator token
      security: [{ operatorBearer: [] }]
      responses:
        '200': { description: Token revoked. }
        '401': { description: Unauthenticated. }
  /me:
    get:
      tags: [Auth]
      summary: Get current operator
      security: [{ operatorBearer: [] }]
      responses:
        '200': { description: Operator profile. }
  /users:
    get:
      tags: [Auth]
      summary: List operator accounts (admin only)
      security: [{ operatorBearer: [] }]
      responses:
        '200': { description: User profiles without password/token fields. }
        '403': { description: Admin role required. }
  /users/{userId}:
    patch:
      tags: [Auth]
      summary: Change an operator role or access status (admin only)
      security: [{ operatorBearer: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                role: { type: string, enum: [admin, operator] }
                status: { type: string, enum: [active, disabled] }
      responses:
        '200': { description: Account updated and audit event written. }
        '403': { description: Admin role required. }
        '422': { description: Invalid update or self lockout attempt. }
  /projects:
    get:
      tags: [Projects]
      security: [{ operatorBearer: [] }]
      responses:
        '200': { description: Projects owned by the authenticated operator. }
    post:
      tags: [Projects]
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                daily_message_limit: { type: integer, minimum: 1, maximum: 1000, default: 20, description: Project-wide daily ceiling shared by every API key. The effective key quota is the minimum of this ceiling's remainder and the key's own daily remainder. Per-key limits are edited in the admin website. }
      responses:
        '201': { description: Project created and audited. }
  /projects/{projectId}:
    get:
      tags: [Projects]
      security: [{ operatorBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/projectId' }
      responses:
        '200': { description: Owned project. }
        '404': { description: Not found or not owned by the operator. }
  /projects/{projectId}/api-keys:
    post:
      tags: [API keys]
      security: [{ operatorBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/projectId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
      responses:
        '201': { description: Secret is returned once, with Cache-Control no-store; only SHA-256 hash is stored. A new key starts at 20 messages per UTC day and 10 new accepts per rolling minute. Change those limits from the admin website, not from this call. }
        '404': { description: Project not owned by the operator. }
  /projects/{projectId}/api-keys/{apiKeyId}:
    delete:
      tags: [API keys]
      security: [{ operatorBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/projectId' }
        - name: apiKeyId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Key revoked and audit event written. }
  /projects/{projectId}/devices:
    get:
      tags: [Devices]
      security: [{ operatorBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/projectId' }
      responses:
        '200': { description: Project devices and last heartbeat metadata. Credentials are never returned. }
    post:
      tags: [Devices]
      security: [{ operatorBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/projectId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
      responses:
        '201': { description: Device credential returned once with Cache-Control no-store; only its hash is stored. }
  /projects/{projectId}/devices/{deviceId}:
    delete:
      tags: [Devices]
      security: [{ operatorBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/projectId' }
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Device revoked; future device authentication is denied. }
  /messages:
    post:
      tags: [Messages]
      summary: Persist a message request for the gateway queue
      description: >-
        Requires a project API key and an idempotency key. Same key and same
        payload returns the original message and does not consume quota; same
        key with a different payload returns 409. The quota reservation, message,
        lifecycle event, and outbox event commit in one database transaction.
        Daily acceptance requires remaining key quota and remaining project
        ceiling. The per-minute limit counts only newly accepted messages for
        that key. This endpoint does not send an SMS.
      security: [{ projectApiKey: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, body]
              properties:
                to: { type: string, pattern: '^\+[1-9][0-9]{7,14}$', example: '+967711234567' }
                body: { type: string, maxLength: 5000 }
      responses:
        '202': { description: Persisted and queued. Returns stable message id and status queued. }
        '200': { description: Idempotent duplicate; original message returned. }
        '409': { description: Idempotency key reused with a different payload. }
        '422': { description: Validation error or missing/invalid idempotency key. }
        '429': { description: API key daily quota, project daily ceiling, or API key per-minute limit reached. Idempotent replays do not return 429 for quota. }
  /otp/request:
    post:
      tags: [OTP]
      summary: Request an OTP SMS through the normal message path
      description: >-
        OTP must already be enabled for the project in the admin panel; otherwise
        the call returns 403 and writes nothing. The code is generated on the
        server, stored only as an HMAC, and is not present in this response.
        The SMS is the normal queued message. The request consumes the API key
        quota. A replay with the same Idempotency-Key and same phone/purpose
        returns the original challenge and does not consume quota again.
      security: [{ projectApiKey: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
                purpose: { type: string, maxLength: 32, default: "login", pattern: '^[A-Za-z0-9_.:-]+$' }
      responses:
        '202': { description: Challenge and message accepted. Response has challenge id, status, purpose, expiry, and message id. It has no code and no phone. }
        '200': { description: Idempotent replay. No additional quota is consumed and the code is not returned. }
        '403': { description: OTP is disabled for this project. }
        '409': { description: Idempotency key reused for a different phone or purpose. }
        '422': { description: Validation failed. }
        '429': { description: Quota exhausted or resend cooldown is active. Nothing new is stored. }
  /otp/verify:
    post:
      tags: [OTP]
      summary: Verify an OTP code
      description: >-
        Checks the HMAC of the submitted code against the latest pending
        challenge for this project, phone, and purpose. Applies expiry and the
        attempt limit. Does not consume message quota and does not echo the code.
      security: [{ projectApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, code]
              properties:
                to: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
                code: { type: string, pattern: '^[0-9]{6}$' }
                purpose: { type: string, maxLength: 32, default: "login" }
      responses:
        '200': { description: verified true and status verified. The code is not returned. }
        '403': { description: OTP is disabled for this project. }
        '422': { description: Verification failed. data.status is invalid, expired, or exhausted. The submitted code is not returned. }
  /otp/{challengeId}/cancel:
    post:
      tags: [OTP]
      summary: Cancel an OTP challenge and recall its message when possible
      description: >-
        Cancels the challenge and, when the linked message is still queued,
        assigned, or only accepted by the device, transitions it to cancelled,
        replaces the encrypted body with a safe withdrawn placeholder, and
        suppresses pending outbox rows. Responses never include the code or
        phone number. Replaying cancel on an already cancelled challenge is
        idempotent. If cellular handoff has already started, the challenge is
        closed but the message is not recalled and the response is 409 with
        message_recalled false.
      security: [{ projectApiKey: [] }]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Challenge cancelled; message_recalled true when the message was withdrawn before send authorization. }
        '404': { description: Challenge not in this project. }
        '409': { description: Challenge closed but message cannot be recalled after send authorization reserved the message as sending. }
  /messages/{messageId}:
    get:
      tags: [Messages]
      security: [{ projectApiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/messageId' }
      responses:
        '200': { description: Message status and append-only lifecycle events for this API key's project. }
        '404': { description: Message not found in the authenticated project. }
  /devices/heartbeat:
    post:
      tags: [Devices]
      security: [{ deviceBearer: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                app_version: { type: string, maxLength: 32 }
                android_version: { type: string, maxLength: 32 }
                api_level: { type: integer, minimum: 26, maximum: 100 }
                network_status: { type: string, enum: [connected, no_internet, disconnected, unknown] }
                sim_status: { type: string, enum: [ready, not_ready, absent, unknown] }
      responses:
        '200': { description: Heartbeat accepted. }
  /devices/messages/claim:
    get:
      tags: [Devices]
      security: [{ deviceBearer: [] }]
      responses:
        '200':
          description: >-
            Next committed message assigned atomically to this project/device,
            or null. Expired or superseded OTP messages are skipped and recalled
            server-side. OTP rows include send_authorization_required true.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { oneOf: [{ $ref: '#/components/schemas/DeviceMessage' }, { type: 'null' }] }
  /devices/messages/{messageId}/send-authorization:
    post:
      tags: [Devices]
      security: [{ deviceBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/messageId' }
      responses:
        '200':
          description: >-
            Atomic pre-send gate for OTP. Locks the challenge and message,
            then transitions a valid accepted OTP message to sending before
            returning send true. That reservation is the cancellation boundary.
            A repeated authorization after a lost response returns send false
            with reason already_started; Android must report UNKNOWN and must
            not invoke SmsManager again. Responses contain no code or body.
            Non-OTP messages return send true with reason not_otp. Denials are
            a 200 response with send false and a reason such as cancelled,
            expired, superseded, already_started, or not_sendable.
        '404': { description: Message not assigned to this device. }
  /devices/messages/{messageId}/acknowledge:
    post:
      tags: [Devices]
      security: [{ deviceBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/messageId' }
      responses:
        '200': { description: Device receipt durably recorded as accepted_by_device. }
        '404': { description: Not assigned to the authenticated device/project. }
        '422': { description: Invalid lifecycle transition. }
  /devices/messages/{messageId}/report:
    post:
      tags: [Devices]
      security: [{ deviceBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/messageId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/MessageStatus' }
                detail_code: { type: string, maxLength: 48 }
      responses:
        '200': { description: Valid transition persisted; sent_to_network is not proof of recipient delivery. }
        '404': { description: Not assigned to the authenticated device/project. }
        '422': { description: Invalid lifecycle transition or report. }
components:
  securitySchemes:
    operatorBearer:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Operator token created by POST /auth/login; revoke with DELETE /auth/token.
    projectApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: One-time device credential; only its SHA-256 hash is stored.
  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema: { type: integer }
    messageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    MessageStatus:
      type: string
      enum: [sending, sent_to_network, send_failed, delivery_reported, delivery_failed, unknown]
    DeviceMessage:
      type: object
      required: [id, to, body, status, send_authorization_required]
      properties:
        id: { type: string, format: uuid }
        to: { type: string }
        body: { type: string }
        status: { type: string, enum: [assigned] }
        send_authorization_required: { type: boolean, description: True for OTP messages that require a send-authorization check before SmsManager. }
